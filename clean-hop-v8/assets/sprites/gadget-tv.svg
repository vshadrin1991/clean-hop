<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b8270"/><stop offset="0.4" stop-color="#4e6350"/><stop offset="1" stop-color="#37473c"/>
    </linearGradient>
  </defs>
  <!-- antennas -->
  <path d="M30 9 L20 1 M30 9 L41 2" stroke="#4e6350" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="1" r="1.6" fill="#4e6350"/>
  <circle cx="41" cy="2" r="1.6" fill="#4e6350"/>
  <!-- legs -->
  <rect x="14" y="44" width="5" height="16" rx="2" fill="url(#pole)"/>
  <rect x="41" y="44" width="5" height="16" rx="2" fill="url(#pole)"/>
  <!-- body -->
  <rect x="6" y="8" width="48" height="36" rx="6" fill="url(#pole)"/>
  <rect x="6" y="8" width="48" height="5" rx="2.5" fill="#7e9484" opacity="0.5"/>
  <!-- screen: the game paints the picture inside this frame -->
  <rect x="12" y="13" width="36" height="26" rx="3" fill="#2b3336"/>
  <!-- channel knobs -->
  <circle cx="51" cy="18" r="2.4" fill="#7e9484"/>
  <circle cx="51" cy="25" r="2.4" fill="#5d7364"/>
  <circle cx="51" cy="32" r="1.8" fill="#37473c"/>
</svg>
