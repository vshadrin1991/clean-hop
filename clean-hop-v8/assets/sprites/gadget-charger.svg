<svg xmlns="http://www.w3.org/2000/svg" width="40" height="70" viewBox="0 0 40 70">
  <defs>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b8270"/><stop offset="0.4" stop-color="#4e6350"/><stop offset="1" stop-color="#37473c"/>
    </linearGradient>
  </defs>
  <!-- post into the ground -->
  <rect x="14" y="20" width="12" height="50" rx="3" fill="url(#pole)"/>
  <rect x="14" y="20" width="3.5" height="50" fill="#7e9484" opacity="0.5"/>
  <!-- socket box; the game draws the LED at (20,10) and the plug at (20,17) -->
  <rect x="8" y="6" width="24" height="22" rx="4" fill="#eef2ea" stroke="#5d7364" stroke-width="2"/>
  <circle cx="16" cy="17" r="2.2" fill="#4e6350"/>
  <circle cx="24" cy="17" r="2.2" fill="#4e6350"/>
</svg>
