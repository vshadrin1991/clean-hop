<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b8270"/><stop offset="0.45" stop-color="#4e6350"/><stop offset="1" stop-color="#37473c"/>
    </linearGradient>
  </defs>
  <!-- poles -->
  <rect x="12" y="14" width="8" height="134" rx="3" fill="url(#pl)"/>
  <rect x="12" y="14" width="2.5" height="134" fill="#7e9484" opacity="0.5"/>
  <rect x="160" y="14" width="8" height="134" rx="3" fill="url(#pl)"/>
  <rect x="160" y="14" width="2.5" height="134" fill="#7e9484" opacity="0.5"/>
  <rect x="9" y="144" width="14" height="6" rx="2" fill="#37473c"/>
  <rect x="157" y="144" width="14" height="6" rx="2" fill="#37473c"/>
  <!-- crossarms + insulators -->
  <rect x="2" y="20" width="28" height="5" rx="2" fill="url(#pl)"/>
  <rect x="2" y="20" width="28" height="2" rx="1" fill="#7e9484" opacity="0.5"/>
  <rect x="150" y="20" width="28" height="5" rx="2" fill="url(#pl)"/>
  <rect x="150" y="20" width="28" height="2" rx="1" fill="#7e9484" opacity="0.5"/>
  <rect x="6" y="25" width="3" height="6" rx="1" fill="#37473c"/>
  <rect x="25" y="25" width="3" height="6" rx="1" fill="#37473c"/>
  <rect x="154" y="25" width="3" height="6" rx="1" fill="#37473c"/>
  <rect x="173" y="25" width="3" height="6" rx="1" fill="#37473c"/>
  <!-- sagging wire (birds perch along this curve) -->
  <path d="M18 24 Q90 60 162 24" stroke="#37473c" stroke-width="2.5" fill="none"/>
  <path d="M18 25.5 Q90 61.5 162 25.5" stroke="#7e9484" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
