<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbca4"/><stop offset="0.6" stop-color="#7fae95"/><stop offset="1" stop-color="#6d9c85"/>
    </linearGradient>
    <linearGradient id="silo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc4b0"/><stop offset="0.4" stop-color="#7fae95"/><stop offset="1" stop-color="#5d8570"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba68f"/><stop offset="1" stop-color="#54796a"/>
    </linearGradient>
    <linearGradient id="glassW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fbff"/><stop offset="0.5" stop-color="#cfeaf6"/><stop offset="1" stop-color="#a9cede"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#9cc4b0"/><stop offset="0.7" stop-color="#7fae95"/><stop offset="1" stop-color="#5d8570"/>
    </radialGradient>
  </defs>

  <!-- production hall -->
  <rect x="70" y="120" width="210" height="100" fill="url(#hall)"/>
  <rect x="70" y="120" width="6" height="100" fill="#5d8570" opacity="0.4"/>
  <rect x="70" y="212" width="210" height="8" fill="#5d8570" opacity="0.5"/>
  <g stroke="#5d8570" stroke-width="1" opacity="0.25">
    <path d="M70 172 H280 M70 196 H280"/>
    <path d="M110 120 V220 M150 120 V220 M190 120 V220 M230 120 V220"/>
  </g>
  <!-- parapet -->
  <rect x="62" y="108" width="226" height="14" rx="4" fill="url(#beam)"/>
  <rect x="62" y="108" width="226" height="5" rx="2" fill="#9cc4b0"/>
  <!-- clerestory window band (FMETA panes) -->
  <g fill="url(#glassW)" stroke="#5d8570" stroke-width="1.6">
    <rect x="86" y="140" width="24" height="24" rx="2"/><rect x="122" y="140" width="24" height="24" rx="2"/><rect x="158" y="140" width="24" height="24" rx="2"/><rect x="194" y="140" width="24" height="24" rx="2"/><rect x="230" y="140" width="24" height="24" rx="2"/>
  </g>
  <g stroke="#5d8570" stroke-width="1" opacity="0.6">
    <path d="M98 140 V164 M134 140 V164 M170 140 V164 M206 140 V164 M242 140 V164"/>
    <path d="M86 152 H110 M122 152 H146 M158 152 H182 M194 152 H218 M230 152 H254"/>
  </g>

  <!-- silo tower: FMETA stack at x~365, top y~48 -->
  <rect x="330" y="52" width="70" height="168" fill="url(#silo)"/>
  <rect x="330" y="52" width="9" height="168" fill="#b8d8c8" opacity="0.45"/>
  <ellipse cx="365" cy="52" rx="35" ry="13" fill="#8fbfa8"/>
  <ellipse cx="365" cy="52" rx="35" ry="13" fill="none" stroke="#5d8570" stroke-width="2"/>
  <ellipse cx="365" cy="50" rx="26" ry="8" fill="#a8d0bc" opacity="0.7"/>
  <g stroke="#5d8570" stroke-width="1.5" opacity="0.4">
    <path d="M330 90 H400 M330 168 H400 M330 196 H400"/>
  </g>
  <rect x="330" y="130" width="70" height="8" fill="#6b9a82"/>
  <rect x="330" y="130" width="70" height="3" fill="#8fbfa8"/>
  <!-- ladder up the silo -->
  <g stroke="#54796a" stroke-width="2" opacity="0.7">
    <path d="M393 60 V216 M399 60 V216"/>
    <path d="M393 70 H399 M393 86 H399 M393 102 H399 M393 118 H399 M393 134 H399 M393 150 H399 M393 166 H399 M393 182 H399 M393 198 H399"/>
  </g>

  <!-- conveyor from hall to silo -->
  <path d="M186 116 L330 66" stroke="#54796a" stroke-width="11" stroke-linecap="round"/>
  <path d="M186 116 L330 66" stroke="#6b9a82" stroke-width="9" stroke-linecap="round"/>
  <path d="M190 113 L326 66" stroke="#8fbfa8" stroke-width="2" opacity="0.8"/>
  <path d="M226 100 L226 116 M268 84 L268 100 M306 70 L306 84" stroke="#54796a" stroke-width="3"/>

  <!-- gantry crane -->
  <rect x="14" y="26" width="11" height="194" fill="url(#beam)"/>
  <rect x="14" y="26" width="4" height="194" fill="#9cc4b0" opacity="0.4"/>
  <g stroke="#54796a" stroke-width="1.5" opacity="0.6">
    <path d="M14 50 L25 62 M14 90 L25 102 M14 130 L25 142 M14 170 L25 182"/>
  </g>
  <rect x="8" y="22" width="170" height="11" rx="3" fill="url(#beam)"/>
  <rect x="8" y="22" width="170" height="4" rx="2" fill="#9cc4b0"/>
  <g stroke="#54796a" stroke-width="1.5" opacity="0.7">
    <path d="M30 22 V33 M52 22 V33 M74 22 V33 M96 22 V33 M118 22 V33 M140 22 V33 M162 22 V33"/>
  </g>
  <rect x="140" y="33" width="5" height="70" fill="#54796a"/>
  <rect x="132" y="103" width="21" height="14" rx="2" fill="url(#beam)"/>
  <rect x="136" y="105" width="13" height="4" rx="1" fill="#9cc4b0"/>

  <!-- spherical gas holder on legs -->
  <ellipse cx="436" cy="86" rx="34" ry="26" fill="url(#sphere)"/>
  <path d="M408 74 Q436 62 464 74" stroke="#a8d0bc" stroke-width="2.5" fill="none" opacity="0.7"/>
  <rect x="402" y="80" width="68" height="22" fill="url(#silo)"/>
  <path d="M410 102 L420 220 M460 102 L450 220 M412 160 L458 160" stroke="#54796a" stroke-width="5" fill="none"/>
  <path d="M416 128 L456 128 M414 190 L454 190" stroke="#54796a" stroke-width="3" fill="none" opacity="0.7"/>
</svg>
