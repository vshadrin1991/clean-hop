    <ellipse cx="55" cy="120" rx="31" ry="12" fill="none" stroke="#5d8570" stroke-width="2"/>
    <ellipse cx="55" cy="118" rx="22" ry="7" fill="#b8d8c8" opacity="0.6"/>
    <rect x="24" y="150" width="62" height="7" fill="#6b9a82"/>
    <rect x="24" y="150" width="62" height="2.5" fill="#8fbfa8"/>
    <path d="M24 176 H86 M24 200 H86" stroke="#5d8570" stroke-width="1.2" opacity="0.35"/>
  </g>
  <g>
    <rect x="102" y="104" width="62" height="116" fill="url(#tank)"/>
    <rect x="102" y="104" width="8" height="116" fill="#b8d8c8" opacity="0.45"/>
    <ellipse cx="133" cy="104" rx="31" ry="12" fill="url(#dome)"/>
    <ellipse cx="133" cy="104" rx="31" ry="12" fill="none" stroke="#5d8570" stroke-width="2"/>
    <ellipse cx="133" cy="102" rx="22" ry="7" fill="#b8d8c8" opacity="0.6"/>
    <rect x="102" y="140" width="62" height="7" fill="#6b9a82"/>
    <rect x="102" y="140" width="62" height="2.5" fill="#8fbfa8"/>
    <path d="M102 168 H164 M102 192 H164" stroke="#5d8570" stroke-width="1.2" opacity="0.35"/>
