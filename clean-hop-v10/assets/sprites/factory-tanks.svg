<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc4b0"/><stop offset="0.35" stop-color="#7fae95"/><stop offset="1" stop-color="#5d8570"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d0bc"/><stop offset="1" stop-color="#7fae95"/>
    </linearGradient>
    <linearGradient id="vent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fbca4"/><stop offset="0.5" stop-color="#7fae95"/><stop offset="1" stop-color="#54796a"/>
    </linearGradient>
    <linearGradient id="hutK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba68f"/><stop offset="1" stop-color="#5d8570"/>
    </linearGradient>
    <linearGradient id="glassK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fbff"/><stop offset="1" stop-color="#a9cede"/>
    </linearGradient>
  </defs>

  <!-- storage tanks -->
  <g>
