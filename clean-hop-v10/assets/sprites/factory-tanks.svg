  <path d="M246 176 Q298 166 316 120" stroke="#8fbfa8" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- vent stack: FMETA stack at x~322, top y~25 -->
  <rect x="316" y="30" width="12" height="190" fill="url(#vent)"/>
  <rect x="316" y="30" width="3.5" height="190" fill="#b8d8c8" opacity="0.5"/>
  <rect x="310" y="26" width="24" height="8" rx="3" fill="url(#vent)"/>
  <rect x="310" y="26" width="24" height="3" rx="1.5" fill="#a8d0bc"/>
  <g stroke="#54796a" stroke-width="1.5" opacity="0.55">
    <path d="M316 52 H328 M316 78 H328 M316 104 H328 M316 130 H328 M316 156 H328 M316 182 H328"/>
  </g>
  <path d="M328 44 L352 44 L352 60" stroke="#54796a" stroke-width="4" fill="none"/>

  <!-- control hut: FMETA panes -->
  <rect x="380" y="160" width="60" height="60" fill="url(#hutK)"/>
  <rect x="380" y="160" width="60" height="5" fill="#8fbfa8"/>
  <rect x="380" y="160" width="5" height="60" fill="#9cc4b0" opacity="0.5"/>
  <rect x="388" y="176" width="18" height="18" rx="2" fill="url(#glassK)" stroke="#4a6d5c" stroke-width="1.5"/>
  <rect x="412" y="176" width="18" height="18" rx="2" fill="url(#glassK)" stroke="#4a6d5c" stroke-width="1.5"/>
  <path d="M397 176 V194 M388 185 H406 M421 176 V194 M412 185 H430" stroke="#4a6d5c" stroke-width="1"/>
