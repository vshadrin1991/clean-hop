  <!-- pipe manifold + walkway railing -->
  <path d="M40 168 L40 158 M118 168 L118 158 M196 168 L196 158" stroke="#54796a" stroke-width="4"/>
  <path d="M40 160 H196" stroke="#6b9a82" stroke-width="5"/>
  <rect x="10" y="176" width="250" height="9" fill="#6b9a82"/>
  <rect x="10" y="176" width="250" height="3" fill="#8fbfa8"/>
  <rect x="18" y="185" width="6" height="35" fill="#54796a"/>
  <rect x="86" y="185" width="6" height="35" fill="#54796a"/>
  <rect x="154" y="185" width="6" height="35" fill="#54796a"/>
  <rect x="222" y="185" width="6" height="35" fill="#54796a"/>
