  <g>
    <rect x="180" y="120" width="62" height="100" fill="url(#tank)"/>
    <rect x="180" y="120" width="8" height="100" fill="#b8d8c8" opacity="0.45"/>
    <ellipse cx="211" cy="120" rx="31" ry="12" fill="url(#dome)"/>
    <ellipse cx="211" cy="120" rx="31" ry="12" fill="none" stroke="#5d8570" stroke-width="2"/>
    <ellipse cx="211" cy="118" rx="22" ry="7" fill="#b8d8c8" opacity="0.6"/>
    <rect x="180" y="150" width="62" height="7" fill="#6b9a82"/>
    <rect x="180" y="150" width="62" height="2.5" fill="#8fbfa8"/>
    <path d="M180 176 H242 M180 200 H242" stroke="#5d8570" stroke-width="1.2" opacity="0.35"/>
