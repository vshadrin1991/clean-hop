<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
  <!-- a steam iron parked upright on its heel: soleplate on the right, the
       tip up, the handle loop on the left, the cord leaving at the heel -->
  <defs>
    <linearGradient id="ishell" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fbfdfc"/><stop offset="0.55" stop-color="#e3ebe7"/><stop offset="1" stop-color="#b9c7c1"/>
    </linearGradient>
    <linearGradient id="isole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e9ca2"/><stop offset="0.35" stop-color="#f1f5f7"/>
      <stop offset="0.62" stop-color="#c3ced3"/><stop offset="1" stop-color="#7c8b92"/>
    </linearGradient>
    <linearGradient id="iskirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63b1bf"/><stop offset="1" stop-color="#3a7f8d"/>
    </linearGradient>
    <linearGradient id="itank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3f7"/><stop offset="1" stop-color="#b3dde6"/>
    </linearGradient>
    <clipPath id="itankc">
      <path d="M18 16.6 C23.5 14.7 28.5 11.2 31.6 7.4 L30.5 38 L21.4 38 L22.1 26.5 C22.3 21.5 20.6 17.6 18 16.6 Z"/>
    </clipPath>
  </defs>
  <!-- the soft shadow it stands on -->
  <ellipse cx="21" cy="61.6" rx="18" ry="2.2" fill="#57705f" opacity="0.45"/>
  <!-- the ribbed cord guard, angled down off the heel -->
  <path d="M8.6 55.2 L2.6 59.4" stroke="#3d4a45" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M8.6 55.2 L4.4 58.2" stroke="#3d4a45" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M7.6 55.9 L3.4 58.8" stroke="#75867f" stroke-width="3.6" stroke-dasharray="0.7 1.1"/>
  <!-- the shell: handle loop, heel and nose in one piece, finger hole cut out -->
  <path fill-rule="evenodd" fill="url(#ishell)"
        d="M33.3 60.5 L9.5 60.5 Q6.5 60.5 6.5 57.5 L6.5 27 C6.5 20 9.5 15.5 15 13.8
           C20 12 27.5 8.5 34 3.3 L33.3 5 Z
           M12.8 45.5 L12.8 26 C12.8 23.2 14.3 21.8 16.6 21.8 C18.9 21.8 20.4 23.4 20.2 26.4
           L19.4 44 C19.3 45.5 18.5 46.3 17.1 46.3 L13.6 46.3 C13.1 46.3 12.8 46 12.8 45.5 Z"/>
  <!-- see-through water tank, the water settled toward the heel -->
  <path d="M18 16.6 C23.5 14.7 28.5 11.2 31.6 7.4 L30.5 38 L21.4 38 L22.1 26.5 C22.3 21.5 20.6 17.6 18 16.6 Z"
        fill="url(#itank)" stroke="#7fa9b0" stroke-width="0.7"/>
  <g clip-path="url(#itankc)">
    <rect x="18" y="25" width="14" height="14" fill="#5fadc0" opacity="0.75"/>
    <path d="M18 25 L32 25" stroke="#e9f8fb" stroke-width="0.8"/>
    <circle cx="26.6" cy="33" r="0.7" fill="#ffffff" opacity="0.7"/>
    <circle cx="28" cy="29.4" r="0.5" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- coloured skirt along the soleplate -->
  <path d="M29 60.5 L33.3 60.5 L33.3 5 L32.4 5.7 Z" fill="url(#iskirt)"/>
  <!-- the heel cap: a seam and the rubber rest pad -->
  <path d="M7.2 51 Q17 49.8 29.2 51.6" fill="none" stroke="#8fa39a" stroke-width="0.8"/>
  <rect x="9" y="59.2" width="20" height="1.3" rx="0.6" fill="#4a5e55" opacity="0.5"/>
  <!-- soft-touch grip along the handle -->
  <path d="M8.6 45.5 L8.6 27.5 C8.6 22 10.6 18.4 14.2 16.6" fill="none" stroke="#3f4f4b"
        stroke-width="2.8" stroke-linecap="round"/>
  <path d="M8 44 L8 28.5" stroke="#6d7f79" stroke-width="0.6" stroke-linecap="round"/>
  <!-- the shell outline, over the inlays -->
  <path fill-rule="evenodd" fill="none" stroke="#4a5e55" stroke-width="1.2" stroke-linejoin="round"
        d="M33.3 60.5 L9.5 60.5 Q6.5 60.5 6.5 57.5 L6.5 27 C6.5 20 9.5 15.5 15 13.8
           C20 12 27.5 8.5 34 3.3
           M12.8 45.5 L12.8 26 C12.8 23.2 14.3 21.8 16.6 21.8 C18.9 21.8 20.4 23.4 20.2 26.4
           L19.4 44 C19.3 45.5 18.5 46.3 17.1 46.3 L13.6 46.3 C13.1 46.3 12.8 46 12.8 45.5 Z"/>
  <!-- steam and spray buttons at the front of the handle -->
  <rect x="14.1" y="12.4" width="3.4" height="2.2" rx="1.1" transform="rotate(-18 15.8 13.5)"
        fill="#4f9aaa" stroke="#2f5f69" stroke-width="0.6"/>
  <rect x="18.5" y="10.8" width="3.4" height="2.2" rx="1.1" transform="rotate(-26 20.2 11.9)"
        fill="#4f9aaa" stroke="#2f5f69" stroke-width="0.6"/>
  <!-- the temperature dial, peeking into the finger hole -->
  <path d="M20.9 33.6 C18.3 34.8 17.9 42.2 20.2 43.6 Z" fill="#4f9aaa" stroke="#2f5f69" stroke-width="0.7"/>
  <path d="M19.2 36.5 L20.5 36.5 M19 38.8 L20.4 38.8 M19.2 41.1 L20.3 41.1" stroke="#c4e5ec" stroke-width="0.55"/>
  <!-- gloss on the nose -->
  <path d="M17 15.3 C22 13.8 27.4 10.6 31.6 6" fill="none" stroke="#ffffff" stroke-width="0.9"
        stroke-linecap="round" opacity="0.8"/>
  <!-- the stainless soleplate, standing on edge -->
  <path d="M32.8 60.5 L36.6 60.5 Q37.8 60.5 37.8 59.3 L37.8 7 C37.8 4.5 36.8 3 35 2.2 L32.8 4.5 Z"
        fill="url(#isole)" stroke="#4a5e55" stroke-width="1"/>
  <path d="M35.2 8 L35.2 58" stroke="#ffffff" stroke-width="0.7" opacity="0.7"/>
  <!-- the heat lamp on the heel cap, dark while off -->
  <circle cx="18.5" cy="55.4" r="2.7" fill="#c5d1cc" stroke="#8fa39a" stroke-width="0.6"/>
  <circle cx="18.5" cy="55.4" r="1.9" fill="#4e6350"/>
</svg>
