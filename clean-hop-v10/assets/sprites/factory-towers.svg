<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="tw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc4b0"/><stop offset="0.4" stop-color="#7fae95"/><stop offset="1" stop-color="#5d8570"/>
    </linearGradient>
    <linearGradient id="twDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8570" stop-opacity="0"/><stop offset="1" stop-color="#4a6d5c" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbfa8"/><stop offset="1" stop-color="#6b9a82"/>
    </linearGradient>
    <linearGradient id="hut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba68f"/><stop offset="1" stop-color="#5d8570"/>
    </linearGradient>
    <linearGradient id="glassT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fbff"/><stop offset="1" stop-color="#a9cede"/>
    </linearGradient>
  </defs>

  <!-- cooling tower 1: FMETA stack top at x~110, y~25 -->
  <path d="M60 220 Q92 140 76 30 L144 30 Q128 140 160 220 Z" fill="url(#tw)"/>
  <path d="M60 220 Q92 140 76 30 L88 30 Q100 140 76 220 Z" fill="#b8d8c8" opacity="0.45"/>
  <path d="M60 220 Q92 140 76 30 L144 30 Q128 140 160 220 Z" fill="url(#twDark)"/>
  <path d="M76 30 Q110 40 144 30" stroke="#5d8570" stroke-width="3" fill="none" opacity="0.6"/>
  <rect x="74" y="24" width="72" height="10" rx="3" fill="url(#rim)"/>
  <rect x="74" y="24" width="72" height="4" rx="2" fill="#a8d0bc"/>
  <g stroke="#5d8570" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M86 44 Q98 130 84 214"/>
    <path d="M110 40 Q116 130 110 216"/>
    <path d="M134 44 Q122 130 136 214"/>
  </g>
  <!-- cooling tower 2: FMETA stack top at x~282, y~52 -->
  <path d="M240 220 Q268 150 254 56 L310 56 Q296 150 324 220 Z" fill="url(#tw)"/>
  <path d="M240 220 Q268 150 254 56 L264 56 Q274 150 254 220 Z" fill="#b8d8c8" opacity="0.45"/>
  <path d="M240 220 Q268 150 254 56 L310 56 Q296 150 324 220 Z" fill="url(#twDark)"/>
  <path d="M254 56 Q282 64 310 56" stroke="#5d8570" stroke-width="3" fill="none" opacity="0.6"/>
  <rect x="252" y="50" width="60" height="10" rx="3" fill="url(#rim)"/>
  <rect x="252" y="50" width="60" height="4" rx="2" fill="#a8d0bc"/>
  <g stroke="#5d8570" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M262 68 Q272 150 260 216"/>
    <path d="M282 66 Q286 150 282 216"/>
    <path d="M302 68 Q292 150 304 216"/>
  </g>

  <!-- pump house: FMETA panes -->
  <rect x="6" y="160" width="60" height="60" fill="url(#hut)"/>
  <rect x="6" y="160" width="60" height="5" fill="#8fbfa8"/>
  <rect x="6" y="160" width="5" height="60" fill="#9cc4b0" opacity="0.5"/>
  <rect x="14" y="176" width="16" height="16" rx="2" fill="url(#glassT)" stroke="#4a6d5c" stroke-width="1.5"/>
  <rect x="38" y="176" width="16" height="16" rx="2" fill="url(#glassT)" stroke="#4a6d5c" stroke-width="1.5"/>
  <path d="M22 176 V192 M14 184 H30 M46 176 V192 M38 184 H54" stroke="#4a6d5c" stroke-width="1"/>
  <path d="M66 196 L96 196" stroke="#6b9a82" stroke-width="6" stroke-linecap="round"/>

  <!-- pipe bridges to the towers -->
  <path d="M110 220 L110 150 Q110 130 130 130" stroke="#6b9a82" stroke-width="8" fill="none"/>
  <path d="M110 220 L110 150 Q110 130 130 130" stroke="#8fbfa8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M282 220 L282 170 Q282 150 300 148" stroke="#6b9a82" stroke-width="8" fill="none"/>
  <path d="M282 220 L282 170 Q282 150 300 148" stroke="#8fbfa8" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- tanker -->
  <rect x="380" y="196" width="60" height="24" rx="8" fill="url(#tw)"/>
  <path d="M382 202 H438" stroke="#5d8570" stroke-width="1.5" opacity="0.6"/>
  <rect x="374" y="214" width="72" height="6" fill="#6b9a82"/>
</svg>
