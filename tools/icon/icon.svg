<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9fe8"/>
      <stop offset="1" stop-color="#d8f3ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc6cf"/>
      <stop offset="1" stop-color="#17505c"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c29462"/>
      <stop offset="1" stop-color="#6a4b31"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- the warm-earth island the bulb stands on, lit from the right -->
    <path d="M132 394 L380 394 Q392 444 352 474 Q308 504 256 506 Q204 504 160 474 Q120 444 132 394 Z" fill="url(#soil)"/>
    <path d="M256 394 L132 394 Q120 444 160 474 Q204 504 256 506 Q236 452 256 394 Z" fill="#3a2818" opacity="0.28"/>
    <ellipse cx="206" cy="440" rx="14" ry="10" fill="#a39d93" stroke="#6e5238" stroke-width="3"/>
    <ellipse cx="316" cy="452" rx="18" ry="12" fill="#a39d93" stroke="#6e5238" stroke-width="3"/>

    <!-- clean water over the island's foot -->
    <rect y="430" width="512" height="82" fill="url(#sea)" opacity="0.88"/>
    <path d="M0 432 Q64 424 128 432 T256 432 T384 432 T512 432" fill="none" stroke="#e6fbff" stroke-width="6" opacity="0.7"/>

    <!-- grass lid -->
    <path d="M124 396 Q120 376 146 374 Q200 364 256 370 Q312 364 366 374 Q392 376 388 396 Q322 408 256 408 Q190 408 124 396 Z" fill="#4fb574"/>
    <path d="M128 392 Q126 380 148 379 Q200 370 256 375 Q312 370 364 379 Q384 381 384 392 Q322 400 256 400 Q190 400 128 392 Z" fill="#5fd35a"/>
  </g>

  <!-- bulb base, under the glass -->
  <rect x="206" y="318" width="100" height="72" rx="14" fill="#8a8f7a"
        stroke="#20303a" stroke-width="12"/>
  <line x1="220" y1="352" x2="292" y2="352" stroke="#20303a" stroke-width="8" stroke-linecap="round"/>
  <line x1="222" y1="370" x2="290" y2="370" stroke="#20303a" stroke-width="8" stroke-linecap="round"/>

  <!-- the bulb's glass -->
  <circle cx="256" cy="215" r="118" fill="#fffaf0" stroke="#20303a" stroke-width="14"/>

  <!-- a green leaf inside the glass: what the saved energy grows -->
  <path d="M256 268 C 214 242 206 190 232 158 C 284 168 302 220 284 262 C 275 271 264 272 256 268 Z"
        fill="#2f8f43"/>
  <path d="M250 256 C 246 220 252 192 268 174" fill="none" stroke="#fffaf0"
        stroke-width="7" stroke-linecap="round"/>

  <!-- a small bolt, top-right -->
  <path d="M410 72 L372 152 h27 l-10 58 50 -86 h-27 l10 -52 Z"
        fill="#ffd44a" stroke="#20303a" stroke-width="9" stroke-linejoin="round"/>
</svg>
